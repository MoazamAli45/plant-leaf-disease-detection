[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leafdx-api"
version = "0.1.0"
description = "Inference and Grad-CAM API for LeafDx"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "numpy>=1.26",
    # TensorFlow: CPU-only build on Linux (Docker, Hugging Face Spaces), regular build on macOS
    "tensorflow-cpu>=2.16,<2.21; sys_platform == 'linux'",
    "tensorflow>=2.16,<2.21; sys_platform != 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ANN"]
ignore = ["ANN401", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
