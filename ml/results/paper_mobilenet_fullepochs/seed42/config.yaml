name: paper_mobilenet_fullepochs
description: Paper mobilenet, original 80/20 split, one full pass over train and val
  per epoch (assumption A8, reading b)
seed: 42
output_dir: /kaggle/working/outputs
data:
  train_manifest: manifests/paper_split/train.csv
  val_manifest: manifests/paper_split/val.csv
  test_manifest: null
  data_root: data
  npd_root: /kaggle/input/datasets/vipoooool/new-plant-diseases-dataset/New Plant
    Diseases Dataset(Augmented)/New Plant Diseases Dataset(Augmented)
  image_size: 224
  resize_method: nearest
  preprocessing: rescale
augment:
  enabled: true
  rotation_range: 30
  width_shift_range: 0.2
  height_shift_range: 0.2
  shear_range: 0.2
  zoom_range: 0.2
  brightness_range:
  - 0.8
  - 1.2
  horizontal_flip: true
  vertical_flip: true
  fill_mode: nearest
model:
  name: paper_mobilenet
  num_classes: 38
  output_activation: softmax
  dropout: 0.2
  alpha: 1.0
  weights: imagenet
  freeze_backbone: true
train:
  epochs: 20
  batch_size: 32
  optimizer: adam
  learning_rate: 0.001
  loss: categorical_crossentropy
  steps_per_epoch: null
  validation_steps: null
  shuffle_buffer: null
  mixed_precision: false
